<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #172033;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      padding: 28px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 35px rgb(23 32 51 / 12%);
      text-align: center;
    }

    h1 { margin: 0 0 8px; }
    #status { min-height: 1.5em; margin: 0 0 20px; color: #4b5563; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0 auto 20px;
    }

    .cell {
      aspect-ratio: 1;
      border: 0;
      border-radius: 12px;
      background: #e8ecf5;
      color: #263b80;
      font: 700 clamp(2.5rem, 15vw, 4rem) / 1 system-ui, sans-serif;
      cursor: pointer;
    }

    .cell:hover:enabled { background: #dce3f3; }
    .cell:focus-visible, #restart:focus-visible { outline: 3px solid #536dfe; outline-offset: 3px; }
    .cell:disabled { cursor: default; }

    #restart {
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #4358d8;
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    #restart:hover { background: #3549c4; }
  </style>
</head>
<body>
  <main>
    <h1>Tic-Tac-Toe</h1>
    <p id="status" aria-live="polite">Player X's turn</p>
    <div class="board" role="group" aria-label="Tic-Tac-Toe board">
      <button class="cell" type="button" aria-label="Row 1, column 1"></button>
      <button class="cell" type="button" aria-label="Row 1, column 2"></button>
      <button class="cell" type="button" aria-label="Row 1, column 3"></button>
      <button class="cell" type="button" aria-label="Row 2, column 1"></button>
      <button class="cell" type="button" aria-label="Row 2, column 2"></button>
      <button class="cell" type="button" aria-label="Row 2, column 3"></button>
      <button class="cell" type="button" aria-label="Row 3, column 1"></button>
      <button class="cell" type="button" aria-label="Row 3, column 2"></button>
      <button class="cell" type="button" aria-label="Row 3, column 3"></button>
    </div>
    <button id="restart" type="button">New game</button>
  </main>

  <script>
    const cells = [...document.querySelectorAll('.cell')];
    const status = document.querySelector('#status');
    const restart = document.querySelector('#restart');
    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameOver = false;

    function playTurn(index) {
      if (board[index] || gameOver) return;

      board[index] = currentPlayer;
      cells[index].textContent = currentPlayer;
      cells[index].setAttribute('aria-label', `Row ${Math.floor(index / 3) + 1}, column ${index % 3 + 1}: ${currentPlayer}`);

      const hasWon = winningLines.some(line => line.every(cell => board[cell] === currentPlayer));
      if (hasWon) {
        status.textContent = `Player ${currentPlayer} wins!`;
        gameOver = true;
        cells.forEach(cell => { cell.disabled = true; });
      } else if (board.every(Boolean)) {
        status.textContent = "It's a draw!";
        gameOver = true;
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        status.textContent = `Player ${currentPlayer}'s turn`;
      }
    }

    function startNewGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameOver = false;
      status.textContent = "Player X's turn";
      cells.forEach((cell, index) => {
        cell.textContent = '';
        cell.disabled = false;
        cell.setAttribute('aria-label', `Row ${Math.floor(index / 3) + 1}, column ${index % 3 + 1}`);
      });
    }

    cells.forEach((cell, index) => cell.addEventListener('click', () => playTurn(index)));
    restart.addEventListener('click', startNewGame);
  </script>
</body>
</html>
