<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe Best of 3</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #172033;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 440px);
      padding: 28px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 35px rgb(23 32 51 / 12%);
      text-align: center;
    }

    h1 { margin: 0 0 10px; }
    .scoreboard {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      background: #eef2ff;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      color: #27376b;
    }

    #status { min-height: 1.6em; margin: 0 0 18px; color: #4b5563; }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0 auto 20px;
    }

    .cell {
      aspect-ratio: 1;
      border: 0;
      border-radius: 12px;
      background: #e8ecf5;
      color: #263b80;
      font: 700 clamp(2.5rem, 15vw, 4rem) / 1 system-ui, sans-serif;
      cursor: pointer;
    }

    .cell:hover:enabled { background: #dce3f3; }
    .cell:focus-visible, .action:focus-visible { outline: 3px solid #536dfe; outline-offset: 3px; }
    .cell:disabled { cursor: default; }

    #winning-line {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    #winning-line line {
      stroke: #22c55e;
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
      filter: drop-shadow(0 1px 1px rgb(255 255 255 / 75%));
      transition: stroke-dashoffset 0.45s ease;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .action {
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      background: #4358d8;
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .action.secondary {
      background: #e5e7eb;
      color: #1f2937;
    }

    .action:hover { filter: brightness(0.98); }
  </style>
</head>
<body>
  <main>
    <h1>Tic-Tac-Toe</h1>
    <div class="scoreboard" aria-live="polite">
      <span>Player X: <strong id="x-score">0</strong></span>
      <span>Player O: <strong id="o-score">0</strong></span>
    </div>
    <p id="status" aria-live="polite">Player X's turn</p>
    <div class="board" role="group" aria-label="Tic-Tac-Toe board">
      <button class="cell" type="button" aria-label="Row 1, column 1"></button>
      <button class="cell" type="button" aria-label="Row 1, column 2"></button>
      <button class="cell" type="button" aria-label="Row 1, column 3"></button>
      <button class="cell" type="button" aria-label="Row 2, column 1"></button>
      <button class="cell" type="button" aria-label="Row 2, column 2"></button>
      <button class="cell" type="button" aria-label="Row 2, column 3"></button>
      <button class="cell" type="button" aria-label="Row 3, column 1"></button>
      <button class="cell" type="button" aria-label="Row 3, column 2"></button>
      <button class="cell" type="button" aria-label="Row 3, column 3"></button>
      <svg id="winning-line" viewBox="0 0 100 100" aria-hidden="true">
        <line x1="0" y1="0" x2="0" y2="0" visibility="hidden"></line>
      </svg>
    </div>

    <div class="actions">
      <button id="next-round" class="action" type="button">Next round</button>
      <button id="reset-match" class="action secondary" type="button">Reset match</button>
    </div>
  </main>

  <script>
    const cells = [...document.querySelectorAll('.cell')];
    const status = document.querySelector('#status');
    const nextRound = document.querySelector('#next-round');
    const resetMatch = document.querySelector('#reset-match');
    const xScore = document.querySelector('#x-score');
    const oScore = document.querySelector('#o-score');
    const boardElement = document.querySelector('.board');
    const winningLineElement = document.querySelector('#winning-line line');

    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameOver = false;
    let matchOver = false;
    let score = { X: 0, O: 0 };

    function renderScore() {
      xScore.textContent = score.X;
      oScore.textContent = score.O;
    }

    function setBoardState() {
      cells.forEach((cell, index) => {
        cell.textContent = board[index] || '';
        cell.disabled = !!board[index] || gameOver;
        cell.setAttribute('aria-label', `Row ${Math.floor(index / 3) + 1}, column ${index % 3 + 1}${board[index] ? ': ' + board[index] : ''}`);
      });
    }

    function showWinningLine(line) {
      const boardRect = boardElement.getBoundingClientRect();
      const centers = line.map(index => {
        const cellRect = cells[index].getBoundingClientRect();
        return {
          x: ((cellRect.left + cellRect.width / 2 - boardRect.left) / boardRect.width) * 100,
          y: ((cellRect.top + cellRect.height / 2 - boardRect.top) / boardRect.height) * 100
        };
      });

      winningLineElement.setAttribute('x1', centers[0].x);
      winningLineElement.setAttribute('y1', centers[0].y);
      winningLineElement.setAttribute('x2', centers[2].x);
      winningLineElement.setAttribute('y2', centers[2].y);
      winningLineElement.style.strokeDasharray = '100';
      winningLineElement.style.strokeDashoffset = '100';
      winningLineElement.setAttribute('visibility', 'visible');

      requestAnimationFrame(() => {
        winningLineElement.style.strokeDashoffset = '0';
      });
    }

    function hideWinningLine() {
      winningLineElement.style.strokeDashoffset = '100';
      winningLineElement.setAttribute('visibility', 'hidden');
    }

    function startNewRound() {
      if (matchOver) {
        status.textContent = 'Match over! Press Reset match to play again.';
        return;
      }

      board = Array(9).fill('');
      currentPlayer = 'X';
      gameOver = false;
      hideWinningLine();
      setBoardState();
      status.textContent = "Player X's turn";
    }

    function finishRound(winner) {
      score[winner] += 1;
      renderScore();

      if (score[winner] >= 2) {
        matchOver = true;
        status.textContent = `Player ${winner} wins the best-of-3 match!`;
        gameOver = true;
        setBoardState();
        return;
      }

      gameOver = true;
      status.textContent = `Player ${winner} wins the round! Press Next round.`;
      setBoardState();
    }

    function playTurn(index) {
      if (board[index] || gameOver || matchOver) return;

      board[index] = currentPlayer;
      setBoardState();

      const winningLine = winningLines.find(line => line.every(cell => board[cell] === currentPlayer));

      if (winningLine) {
        showWinningLine(winningLine);
        finishRound(currentPlayer);
        return;
      }

      if (board.every(Boolean)) {
        status.textContent = "It's a draw! Press Next round.";
        gameOver = true;
        setBoardState();
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      status.textContent = `Player ${currentPlayer}'s turn`;
      setBoardState();
    }

    function resetGame() {
      score = { X: 0, O: 0 };
      matchOver = false;
      renderScore();
      startNewRound();
    }

    cells.forEach((cell, index) => cell.addEventListener('click', () => playTurn(index)));
    nextRound.addEventListener('click', startNewRound);
    resetMatch.addEventListener('click', resetGame);

    renderScore();
    setBoardState();
  </script>
</body>
</html>
